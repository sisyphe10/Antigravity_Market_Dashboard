  body, #chat, header, header span, .msg, .msg .bubble, .bubble b, .bubble a,

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  @media (max-width: 800px) { #sidebar { width: 168px; } #newchat { margin: 8px; padding: 8px; } }
  /* 생각 중 표시 — 앰버 펄스 + 단계 문구 + 경과 초 */
  .thinking { color: #fff; opacity: 0.9; font-style: normal; display: inline-flex;
              align-items: center; gap: 9px; }
  .think-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--aoe-amber);
               animation: aoe-pulse 1.1s ease-in-out infinite; flex: none; }
  @keyframes aoe-pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); }
                         50% { opacity: 1; transform: scale(1.15); } }
  .think-sec { color: #fff; opacity: 0.45; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* 실패 알림 배너 (저장·삭제·목록 조회 실패를 조용히 삼키지 않는다) */
  #notice { position: fixed; right: 18px; bottom: 96px; z-index: 300; display: none;
            max-width: 420px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
            line-height: 1.5; background: #3a1412; border: 1px solid var(--aoe-up);
            color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  /* 태그 검색 결과 카드 (2026-07-29) */
  .tag-head { font-size: 13px; color: var(--aoe-amber-bright); margin-bottom: 8px; }
  .tag-card { border: 1px solid var(--aoe-border); border-radius: 8px; padding: 8px 11px;
              margin: 6px 0; cursor: pointer; background: var(--aoe-card); }
  .tag-card:hover { border-color: var(--aoe-amber); }
  .tag-meta { font-size: 11.5px; color: #fff; opacity: 0.6; margin-bottom: 3px; }
  .tag-snip { font-size: 13.5px; color: #fff; line-height: 1.55; }
  .tag-full { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--aoe-input-border);

<div id="shell">
  <aside id="sidebar">
    <button id="newchat" type="button">+ 새 대화</button>
    <div id="convs"></div>
  </aside>
  <main id="main">
    <div id="chat"></div>
    <footer>
      <div id="sug"></div>
      <form id="form">
        <textarea id="q" rows="1"></textarea>
        <button id="send" type="submit">질문</button>
      </form>
    </footer>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const q = document.getElementById('q');
const send = document.getElementById('send');
const convs = document.getElementById('convs');
const newchatBtn = document.getElementById('newchat');
const history = [];
let convId = localStorage.getItem('wikiConv') || null;

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 최소 markdown 렌더러 (외부 의존 없음): 표·볼드·코드·헤딩·리스트
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', inCode = false, inTable = false, inList = false;
  const flush = () => { if (inTable) { html += '</table>'; inTable = false; }
                        if (inList) { html += '</ul>'; inList = false; } };
  for (let line of lines) {
    if (line.startsWith('```')) { flush(); html += inCode ? '</pre>' : '<pre>'; inCode = !inCode; continue; }
    if (inCode) { html += line + '\n'; continue; }
    let t = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
    if (/^\|.*\|\s*$/.test(line)) {
      if (/^\|[\s:|-]+\|\s*$/.test(line)) continue;
      if (!inTable) { flush(); html += '<table>'; inTable = true; }
      const cells = t.replace(/^\||\|\s*$/g, '').split('|');
      const tag = html.endsWith('<table>') ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
      continue;
    }
    if (/^#{2,3}\s/.test(line)) { flush(); html += `<h3>${t.replace(/^#{2,3}\s/, '')}</h3>`; continue; }
    if (/^[-*]\s/.test(line)) { if (!inList) { flush(); html += '<ul>'; inList = true; }
                                html += `<li>${t.replace(/^[-*]\s/, '')}</li>`; continue; }
    flush();
    html += t + '<br>';
  }
  flush();
  if (inCode) html += '</pre>';
  return html;
}

function add(role, content, stepsInfo) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const inner = role === 'user' ? esc(content) : md(content);
  let steps = '';
  if (stepsInfo && stepsInfo.length)
    steps = `<div class="steps">${stepsInfo.map(s => '🔧 ' + s.tool).join(' · ')}</div>`;
  div.innerHTML = `<div class="bubble">${inner}${steps}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function notify(msg) {
  let el = document.getElementById('notice');
  if (!el) { el = document.createElement('div'); el.id = 'notice'; document.body.appendChild(el); }
  el.textContent = '\u26A0 ' + msg;
  el.style.display = 'block';
  clearTimeout(notify._t);
  notify._t = setTimeout(() => { el.style.display = 'none'; }, 7000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  q.value = '';
  hideSug();
  if (question.startsWith('#')) {      // 태그 검색 — LLM 호출 없이 즉시 (비용 0)
    add('user', question);
    runTagSearch(question);
    q.focus();
    return;
  }
  // 답변을 '요청 시점의 대화'에 고정 — 대기 중 다른 대화를 열어도 엉뚱한 곳에 저장되지 않는다
  const reqConv = convId;
  const baseMsgs = history.slice();
  add('user', question);
  send.disabled = true;
  const wait = add('bot', '');
  startThinking(wait.querySelector('.bubble'));
  try {
    const res = await fetch('ask', {  // 상대경로 — /wiki/ 프록시 하위에서도 동작 (2026-07-12)
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, history: baseMsgs})
    });
    const data = await res.json();
    const here = (reqConv === convId);   // 그 사이 대화를 바꿨는지
    wait.remove();
    const turn = [{role: 'user', content: question},
                  {role: 'assistant', content: data.answer, steps: data.steps || []}];
    if (here) {
      add('bot', data.answer, data.steps);
      history.push(turn[0], turn[1]);
    }
    const savedId = await persist(reqConv, baseMsgs.concat(turn));
    if (here && !reqConv && savedId) {
      convId = savedId;
      localStorage.setItem('wikiConv', savedId);
      loadList();
    }
  } catch (err) {
    wait.remove();
    if (reqConv === convId) add('bot', '오류: ' + err.message);
  }
  stopThinking();
  send.disabled = false;
  q.focus();
});

// ── 생각 중 표시 (2026-07-29) ─────────────────────────────────────
const THINK_LINES = ['질문을 뜯어보는 중', '데이터레이크를 뒤지는 중', '쿼리를 짜는 중',
                     '리서치 노트를 읽는 중', '숫자를 맞춰보는 중', '근거를 정리하는 중',
                     '답을 다듬는 중'];
let thinkTimer = null;

function startThinking(box) {
  const t0 = Date.now();
  box.innerHTML = '<span class="thinking"><span class="think-dot"></span>' +
                  '<span class="think-text"></span><span class="think-sec"></span></span>';
  const txt = box.querySelector('.think-text');
  const sec = box.querySelector('.think-sec');
  const tick = () => {
    const s = Math.round((Date.now() - t0) / 1000);
    txt.textContent = THINK_LINES[Math.min(Math.floor(s / 7), THINK_LINES.length - 1)] + '…';
    sec.textContent = s >= 3 ? s + '초' : '';
  };
  tick();
  clearInterval(thinkTimer);
  thinkTimer = setInterval(tick, 1000);
}

function stopThinking() { clearInterval(thinkTimer); thinkTimer = null; }

// ── 대화 기록 (서버 저장, 2026-07-29) ─────────────────────────────
function fmtWhen(s) { return (s || '').slice(5); }  // 07-29 14:03

async function loadList() {
  try {
    const list = await (await fetch('chats')).json();
    convs.innerHTML = '';
    list.forEach(c => {
      const d = document.createElement('div');
      d.className = 'conv' + (c.id === convId ? ' active' : '');
      d.innerHTML = '<div class="conv-title"></div><div class="conv-date"></div>' +
                    '<button class="conv-del" type="button" title="삭제">×</button>';
      d.querySelector('.conv-title').textContent = c.title;
      d.querySelector('.conv-date').textContent = fmtWhen(c.updated_at);
      d.addEventListener('click', e => {
        if (!e.target.classList.contains('conv-del')) openConv(c.id);
      });
      d.querySelector('.conv-del').addEventListener('click', e => {
        e.stopPropagation(); armDelete(e.target, c.id);
      });
      convs.appendChild(d);
    });
    return list;
  } catch (err) {
    notify('대화 목록을 불러오지 못했습니다');
    return null;                     // 실패와 '빈 목록'을 구분
  }
}

// 삭제는 2단 확인 (브라우저 confirm 미사용)
function armDelete(btn, id) {
  if (btn.classList.contains('armed')) { deleteConv(id); return; }
  btn.classList.add('armed'); btn.textContent = '삭제?';
  setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '×'; }, 3000);
}

async function deleteConv(id) {
  try {
    const res = await fetch('chats/' + id, {method: 'DELETE'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch (err) {
    notify('삭제 실패 (' + err.message + ') — 대화는 그대로 남아 있습니다');
    return;
  }
  if (id === convId) {
    convId = null; localStorage.removeItem('wikiConv');
    history.length = 0; chat.innerHTML = '';
  }
  loadList();
}

function newConv() {
  convId = null; localStorage.removeItem('wikiConv');
  history.length = 0; chat.innerHTML = '';
  loadList(); q.focus();
}

async function openConv(id) {
  const res = await fetch('chats/' + id);
  if (!res.ok) return;
  const data = await res.json();
  convId = id; localStorage.setItem('wikiConv', id);
  history.length = 0; chat.innerHTML = '';
  (data.messages || []).forEach(m => {
    history.push(m);
    add(m.role === 'user' ? 'user' : 'bot', m.content, m.steps);
  });
  loadList();
  chat.scrollTop = chat.scrollHeight;
}

// 지정한 대화 id 로 저장하고 저장된 id 를 반환 (실패 시 null + 사용자 알림)
async function persist(cid, msgs) {
  try {
    const res = await fetch('chats', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: cid || '', messages: msgs})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    loadList();
    return data.id || null;
  } catch (err) {
    notify('저장 실패 — 이 답변은 기록에 남지 않습니다 (' + err.message + ')');
    return null;
  }
}

newchatBtn.addEventListener('click', newConv);
(async () => {
  const list = await loadList();
  if (!list) return;                 // 조회 실패면 마지막 대화 포인터를 지우지 않는다
  if (convId && list.some(c => c.id === convId)) openConv(convId);
  else if (convId) { convId = null; localStorage.removeItem('wikiConv'); }
})();

// ── 태그 검색 (인덱스 직조회, LLM 미사용 — 2026-07-29) ─────────────
const CORPUS_LABEL = {note: '리서치노트', transcript: '콜 전문', analysis: '실적 분석'};

function tagCard(r) {
  const card = document.createElement('div');
  card.className = 'tag-card';
  const meta = document.createElement('div');
  meta.className = 'tag-meta';
  meta.textContent = [r.doc_date || '', CORPUS_LABEL[r.corpus] || r.corpus, r.title || '']
                     .filter(Boolean).join(' · ');
  const snip = document.createElement('div');
  snip.className = 'tag-snip';
  snip.textContent = r.snippet || '';
  card.appendChild(meta);
  card.appendChild(snip);
  card.addEventListener('click', async () => {
    const open = card.querySelector('.tag-full');
    if (open) { open.remove(); return; }
    const full = document.createElement('div');
    full.className = 'tag-full';
    full.textContent = '불러오는 중…';
    card.appendChild(full);
    try {
      const res = await fetch('tags/doc?rel=' + encodeURIComponent(r.rel_path) +
                              '&anchor=' + encodeURIComponent(r.anchor || ''));
      const data = await res.json();
      full.textContent = data.text || data.error || '(내용 없음)';
    } catch (err) { full.textContent = '본문을 불러오지 못했습니다: ' + err.message; }
  });
  return card;
}

function chipRow(items, onPick) {
  const row = document.createElement('div');
  items.forEach(it => {
    const c = document.createElement('span');
    c.className = 'tag-chip';
    c.textContent = '#' + it.label + (it.freq ? ' ' + it.freq : '');
    c.addEventListener('click', () => onPick(it));
    row.appendChild(c);
  });
  return row;
}

async function runTagSearch(query) {
  const box = add('bot', '');
  const bub = box.querySelector('.bubble');
  bub.innerHTML = '<span class="thinking"><span class="think-dot"></span>태그 검색 중…</span>';
  try {
    const data = await (await fetch('tags/search?q=' + encodeURIComponent(query) + '&limit=30')).json();
    bub.innerHTML = '';
    if (data.error) { bub.textContent = data.error; return; }
    if (!data.results || !data.results.length) {
      const p = document.createElement('div');
      p.textContent = query + ' 태그로 찾은 내용이 없습니다.';
      bub.appendChild(p);
      const sug = await (await fetch('tags/suggest?q=' + encodeURIComponent(query) + '&limit=12')).json();
      if (sug.length) {
        const hint = document.createElement('div');
        hint.className = 'tag-head';
        hint.textContent = '혹시 이건가요?';
        bub.appendChild(hint);
        bub.appendChild(chipRow(sug, it => { q.value = '#' + it.label; form.requestSubmit(); }));
      }
      return;
    }
    const head = document.createElement('div');
    head.className = 'tag-head';
    head.textContent = data.matched.map(m => '#' + m.label).join('  ') +
                       '  —  ' + data.total + '건 중 최근 ' + data.results.length + '건';
    bub.appendChild(head);
    data.results.forEach(r => bub.appendChild(tagCard(r)));
  } catch (err) {
    bub.textContent = '태그 검색 실패: ' + err.message;
  }
  chat.scrollTop = chat.scrollHeight;
}

// 입력 중 '#' 자동완성
const sugBox = document.getElementById('sug');
let sugTimer = null;

function hideSug() { sugBox.style.display = 'none'; sugBox.innerHTML = ''; }

async function showSug(prefix) {
  try {
    const list = await (await fetch('tags/suggest?q=' + encodeURIComponent(prefix) + '&limit=10')).json();
    if (!list.length) { hideSug(); return; }
    sugBox.innerHTML = '';
    sugBox.appendChild(chipRow(list, it => {
      q.value = q.value.replace(/(^|\s)#([^\s#]*)$/, '$1#' + it.label);
      hideSug();
      q.focus();
    }));
    sugBox.style.display = 'block';
  } catch (err) { hideSug(); }
}

q.addEventListener('input', () => {
  const m = q.value.match(/(^|\s)#([^\s#]*)$/);
  clearTimeout(sugTimer);
  if (!m) { hideSug(); return; }
  sugTimer = setTimeout(() => showSug(m[2]), 150);
});

q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
